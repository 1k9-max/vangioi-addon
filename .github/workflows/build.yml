name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean build --refresh-dependencies --no-daemon -Pbuild_number=${{ github.run_number }}
          else
            gradle clean build --refresh-dependencies --no-daemon -Pbuild_number=${{ github.run_number }}
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vangioi-addon-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
          if-no-files-found: error

      - name: Send File and Commit to Discord Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import urllib.request
          import json
          import subprocess

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook_url:
              print("Lỗi: Chưa cấu hình DISCORD_WEBHOOK_URL secret!")
              exit(1)

          # Tìm file .jar trong thư mục build/libs
          jar_files = glob.glob("build/libs/*.jar")
          if not jar_files:
              print("Lỗi: Không tìm thấy file .jar nào!")
              exit(1)
          
          jar_path = jar_files[0]
          
          # Lấy số lần chạy workflow và git info an toàn
          run_num = os.environ.get("GITHUB_RUN_NUMBER", "1")
          
          try:
              commit_msg = subprocess.check_output(["git", "log", "-1", "--pretty=format:%s"]).decode("utf-8").strip()
          except Exception:
              commit_msg = "Cập nhật mã nguồn"

          try:
              short_sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"]).decode("utf-8").strip()
          except Exception:
              short_sha = "unknown"

          msg = f"🚀 **Build thành công số #{run_num}**\n📝 **Commit:** {commit_msg} (`{short_sha}`)"

          # Đóng gói multipart/form-data gửi lên Discord Webhook
          boundary = "----------------D
