name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean build --refresh-dependencies --no-daemon -Pbuild_number=${{ github.run_number }}
          else
            gradle clean build --refresh-dependencies --no-daemon -Pbuild_number=${{ github.run_number }}
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vangioi-addon-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
          if-no-files-found: error

      - name: Send File and Commit to Discord Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" | head -n 1)
          
          if [ -f "$JAR_FILE" ]; then
            # Lấy thông điệp commit an toàn bằng git log trực tiếp
            COMMIT_MSG=$(git log -1 --pretty=format:'%s')
            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="Cập nhật mã nguồn"
            fi
            
            RUN_NUM="${{ github.run_number }}"
            SHORT_SHA=$(git rev-parse --short HEAD)
            
            # Gán giá trị vào biến môi trường chạy Python
            export RUN_NUM
            export COMMIT_MSG
            export SHORT_SHA
            export JAR_FILE
            
            # Thực thi gửi tin nhắn kèm file qua Python
            python3 -c '
import os, urllib.request, json

url = os.environ["DISCORD_WEBHOOK_URL"]
run_num = os.environ["RUN_NUM"]
commit_msg = os.environ["COMMIT_MSG"]
short_sha = os.environ["SHORT_SHA"]
jar_path = os.environ["JAR_FILE"]

msg = f"🚀 **Build thành công số #{run_num}**\n📝 **Commit:** {commit_msg} (`{short_sha}`)"

boundary = "----WebKitFormBoundary7MA4YWxkTrZu0gW"
data = []
data.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"payload_json\"\r\n\r\n" + json.dumps({"content": msg}) + "\r\n")

with open(jar_path, "rb") as f:
    file_bytes = f.read()
file_name = os.path.basename(jar_path)

data.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"file0\"; filename=\"{file_name}\"\r\nContent-Type: application/java-archive\r\n\r\n".encode("utf-8") + file_bytes + b"\r\n")
data.append(f"--{boundary}--\r\n".encode("utf-8"))

body = b"".join([d.encode("utf-8") if isinstance(d, str) else d for d in data])
req = urllib.request.Request(url, data=body, headers={"Content-Type": f"multipart/form-data; boundary={boundary}"})

try:
    with urllib.request.urlopen(req) as response:
        print("Gửi Discord thành công:", response.status)
except Exception as e:
    print("Lỗi gửi Discord:", e)
            '
          else
            echo "Không tìm thấy file .jar để gửi lên Discord!"
            exit 1
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
