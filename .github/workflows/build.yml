name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean build --refresh-dependencies --no-daemon -Pbuild_number=${{ github.run_number }}
          else
            gradle clean build --refresh-dependencies --no-daemon -Pbuild_number=${{ github.run_number }}
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vangioi-addon-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
          if-no-files-found: error

      - name: Send File and Commit to Discord Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import urllib.request
          import json
          import subprocess

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook_url:
              print("Lỗi: Chưa cấu hình DISCORD_WEBHOOK_URL secret!")
              exit(1)

          jar_files = glob.glob("build/libs/*.jar")
          if not jar_files:
              print("Lỗi: Không tìm thấy file .jar nào!")
              exit(1)
          
          jar_path = jar_files[0]
          run_num = os.environ.get("GITHUB_RUN_NUMBER", "1")
          
          try:
              commit_msg = subprocess.check_output(["git", "log", "-1", "--pretty=format:%s"]).decode("utf-8").strip()
          except Exception:
              commit_msg = "Cập nhật mã nguồn"

          try:
              short_sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"]).decode("utf-8").strip()
          except Exception:
              short_sha = "unknown"

          msg = f"🚀 **Build thành công số #{run_num}**\n📝 **Commit:** {commit_msg} (`{short_sha}`)"

          boundary = "----WebKitFormBoundary7MA4YWxkTrZu0gW"
          data = []
          data.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"payload_json\"\r\n\r\n" + json.dumps({"content": msg}) + "\r\n")

          with open(jar_path, "rb") as f:
              file_bytes = f.read()
          file_name = os.path.basename(jar_path)

          data.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"file0\"; filename=\"{file_name}\"\r\nContent-Type: application/java-archive\r\n\r\n".encode("utf-8") + file_bytes + b"\r\n")
          data.append(f"--{boundary}--\r\n".encode("utf-8"))

          body = b"".join([d.encode("utf-8") if isinstance(d, str) else d for d in data])
          
          # ĐÃ SỬA CHỖ NÀY: Thêm User-Agent để vượt qua tường lửa của Discord
          headers = {
              "Content-Type": f"multipart/form-data; boundary={boundary}",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }
          req = urllib.request.Request(webhook_url, data=body, headers=headers)

          try:
              with urllib.request.urlopen(req) as response:
                  print("Gửi Discord thành công:", response.status)
          except urllib.error.HTTPError as e:
              print(f"Lỗi gửi Discord: HTTP Error {e.code}: {e.reason}")
              print(e.read().decode("utf-8")) # In ra chi tiết lỗi từ Discord nếu có
              exit(1)
          except Exception as e:
              print("Lỗi gửi Discord:", e)
              exit(1)
          EOF
