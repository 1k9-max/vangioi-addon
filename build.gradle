plugins {
    id "fabric-loom" version "1.14-SNAPSHOT"
}

base {
    archivesName = project.archives_base_name
    version = project.mod_version
    group = project.maven_group
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    // Local jars dung de bien dich cung (Litematica / MaliLib), xem thu muc /libs. Day la OPTIONAL
    // (soft) dependency - chi de compile, KHONG bi dong goi/shade vao jar cua addon (xem "jar { exclude }"
    // ben duoi). Luc chay, module FlyToPlacement tu kiem tra FabricLoader.isModLoaded("litematica")
    // truoc khi dong den bat ky class nao cua no, nen addon van chay binh thuong tren instance khong
    // co cai Litematica.
    flatDir {
        dirs "libs"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor Client
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"

    // Litematica + MaliLib - CHI de bien dich (modCompileOnly), khong bundle vao jar output.
    modCompileOnly files("libs/litematica-fabric-1_21_4-0_21_7.jar")
    modCompileOnly files("libs/malilib-fabric-1_21_4-0_23_5.jar")
}

processResources {
    def propertyMap = [
        "version"   : project.version,
        "mc_version": project.minecraft_version,
    ]

    filesMatching("fabric.mod.json") {
        expand(propertyMap)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    // Khong bao gio dong goi nham 2 file jar soft-dependency nay vao build cua addon
    exclude "litematica*", "malilib*"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

tasks.register("sourceArchive", Zip) {
    archiveFileName = "${project.archives_base_name}-${project.version}-src.zip"
    destinationDirectory = layout.buildDirectory.dir("source-dist")
    from("src") {
        into("src")
    }
    from("build.gradle")
    from("gradle.properties")
    from("settings.gradle")
    from("README.md")
    from("LICENSE")
}

tasks.named("build") {
    finalizedBy("sourceArchive")
}
